<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%seo.description%" />
    <link rel="canonical" href="%seo.url%" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="%seo.locale%" />
    <meta property="og:url" content="%seo.url%" />
    <meta property="og:title" content="%seo.title%" />
    <meta property="og:description" content="%seo.description%" />
    <meta property="og:image" content="%seo.imageUrl%" />
    <meta property="og:image:width" content="%seo.imageWidth%" />
    <meta property="og:image:height" content="%seo.imageHeight%" />
    <meta property="og:image:alt" content="%seo.imageAlt%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%seo.title%" />
    <meta name="twitter:description" content="%seo.description%" />
    <meta name="twitter:image" content="%seo.imageUrl%" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Skarlet Araque",
        "jobTitle": "Frontend Developer",
        "url": "%seo.url%",
        "sameAs": ["https://linkedin.com/in/skarlet-araque", "https://github.com/SkarletA"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>%seo.title%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
